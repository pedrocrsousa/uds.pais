<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clube · Espaço dos Pais</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--pri:#1d6fd1;--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e3e6ea;--chip:#eef1f5;color-scheme:light dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2227;--tx:#eceef1;--mu:#9aa3ad;--bd:#2d333a;--chip:#2a3038}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2227;--tx:#eceef1;--mu:#9aa3ad;--bd:#2d333a;--chip:#2a3038}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header img{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#fff}
header h1{font-size:18px;margin:0}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:4}
nav button{flex:1;min-width:max-content;padding:12px 14px;border:0;background:none;color:var(--mu);font:inherit;font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-color:var(--pri)}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:15px;color:var(--mu);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.tag{background:var(--pri);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700}
.mu{color:var(--mu);font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:14px}
button.b{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
button.b.o{background:none;color:var(--pri);border:1.5px solid var(--pri)}button.b.r{background:#c0392b}
button:disabled{opacity:.5}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
.score{font-size:24px;font-weight:800}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.empty{text-align:center;color:var(--mu);padding:20px}
details summary{color:var(--pri);font-weight:600;margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.day{aspect-ratio:1;border:0;border-radius:8px;background:var(--chip);color:var(--tx);font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.day.today{font-weight:800;box-shadow:inset 0 0 0 1.5px var(--mu)}.day.sel{box-shadow:inset 0 0 0 2.5px var(--pri)}
.dots{display:flex;gap:2px;min-height:6px}.dots i,i.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
i.da{background:var(--pri)}i.db{background:#e67e22}
.gl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--bd);margin-top:8px;padding:8px 0 0;color:var(--tx);font:inherit;font-size:15px}
.al{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--pri);border-radius:12px;padding:10px 12px;margin-bottom:8px;color:var(--tx);font:inherit;font-size:15px}.al.u{border-color:#e67e22;background:var(--chip)}
header h1{min-width:0}
#who{margin-left:auto;text-align:right;font-size:12px;line-height:1.25;max-width:58%;min-width:0}
#who span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#who button{margin-top:4px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.75);border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;font-weight:600}
#vs{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#vs>div{background:var(--card);color:var(--tx);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.vph{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.vph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
a.vl{display:block;text-align:center;text-decoration:none;margin-top:8px}
</style></head>
<body>
<header><img id="logo" alt="" hidden><h1 id="cname">Espaço dos Pais</h1><div id="who" hidden><span id="who-n"></span><span id="who-e"></span><button type="button" data-a="logout">Terminar sessão</button></div></header>
<nav id="nav"></nav>
<main id="view"><div class="empty">A carregar…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
const TABS=[["jogos","⚽ Jogos"],["paes","🥖 Pães"],["prendas","🎂 Aniversários"],["torneio","🏆 Torneio"],["fotos","📷 Fotos"],["perfil","👤 Perfil"],["ideas","💡 Ideias"]];
let tab="jogos",db,user,assets,uid=null,isAdmin=false;
const S={settings:{},consents:[],bdays:[],gopts:[],gvotes:[],prefs:[],fams:[],children:[],ideas:[],ivotes:[],kids:[],games:[],gifts:[],contribs:[],venues:[],votes:[],bread:[],photos:[]},N={};
const $=s=>document.querySelector(s);
let pend="";
function toast(m){let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";e.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:12px 14px;border-radius:12px;z-index:20;text-align:center";document.body.appendChild(e)}e.textContent=m;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,3500)}
window.alert=toast;
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=id=>N[id]||"…";
const fmtD=(d,t)=>d?new Date(d+"T12:00").toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"})+(t?" · "+t:""):"";
const SIGN={},BLANK="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
function img(id){if(!id)return BLANK;if(id.startsWith("pub:"))return sb.storage.from("club").getPublicUrl(id.slice(4)).data.publicUrl;
  if(SIGN[id])return SIGN[id];if(!SIGN["~"+id]){SIGN["~"+id]=1;sb.storage.from("photos").createSignedUrl(id,3600).then(r=>{if(r.data){SIGN[id]=r.data.signedUrl;render()}})}return BLANK}
let raf;function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}

function draw(){if(window.HOLD)return;
  const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$("#view").contains(a))return;
  const st=S.settings;
  document.documentElement.style.setProperty("--pri",st.color||"#1d6fd1");
  $("#cname").textContent=st.name||"Espaço dos Pais";
  const lg=$("#logo");if(st.logo){lg.src=img(st.logo);lg.hidden=false}else lg.hidden=true;
  const tabs=(isAdmin?[...TABS,["admin","⚙️ Admin"]]:TABS).filter(([k])=>k!="ideas"||S.settings.ideas!==false);
  $("#nav").innerHTML=tabs.map(([k,l])=>`<button data-a="tab" data-k="${k}" class="${k==tab?"on":""}">${l}${k=="prendas"&&pendingCount()?" 🔴":""}</button>`).join("");
  $("#view").innerHTML=consentGate()+alertsHtml()+({jogos,paes:()=>pedidos()+paes(),prendas,torneio,fotos,perfil,ideas,admin})[tab]();
  resolveNames();
}

async function resolveNames(){
  const ids=[...S.contribs,...S.bread,...S.photos,...S.consents.map(c=>({uid:c.id})),...S.children.flatMap(c=>(c.guardians||[]).map(u=>({uid:u}))),...S.ideas.map(i=>({uid:i.uid}))].map(x=>x.uid).filter(i=>i&&!N[i]);
  if(!ids.length||!user)return;
  try{const p=await user.profiles([...new Set(ids)]);let ch=false;
    for(const i of new Set(ids)){const n=p[i]&&p[i].name;N[i]=n||"Pai/Mãe";ch=true}
    if(ch)render()}catch(e){ids.forEach(i=>N[i]="Pai/Mãe")}
}

/* ---------- PERFIL / FAMÍLIAS ---------- */
const CATS=["Petiz","Traquina","Benjamim","Infantil","Iniciado","Juvenil"];
const CAT_KEYS=["petiz","traquin","benjam","infant","inici","juven"];
const canon=c=>{const n=norm(c||"");return CAT_KEYS.find(p=>n.startsWith(p))||n};
const ekn=x=>canon(String(x||"").split("-")[0]);
const catLabel=k=>CATS.find(x=>canon(x)==k)||k;
let fm="meus",pk="";
const cekey=c=>canon(c);
const myKids=()=>S.children.filter(c=>(c.guardians||[]).includes(uid));
const joinN=n=>n.length>1?n.slice(0,-1).join(", ")+" e "+n[n.length-1]:n[0];
const famLabelFrom=ch=>"Pais do "+joinN(ch.map(c=>c.name));
function famLabel(u,ek){const f=S.fams.find(x=>x.id==u),ch=((f&&f.children)||[]).filter(c=>cekey(c.cat,c.team)==ek);return ch.length?famLabelFrom(ch):"Pais de "+nm(u)}
function kidLabel(b){if(b.kids){const ns=b.kids.map(id=>(S.children.find(c=>c.id==id)||{}).name).filter(Boolean);if(ns.length)return "Pais do "+joinN(ns)}if(b.ek)return famLabel(b.uid,b.ek);const k=S.kids.find(x=>x.id==b.kid);return k?"Pais do "+k.name:nm(b.uid)}
function myEk(g){const has=(g.players||"").trim(),k=myKids().find(c=>canon(c.cat)==canon(g.cat||c.cat)&&(!has||conv(g,c)));return k?canon(k.cat):""}
function myEkOld(g){const k=myKids().find(c=>String(c.team).toUpperCase()==String(g.team).toUpperCase()&&(!g.cat||norm(g.cat)==norm(c.cat)));return k?cekey(k.cat,k.team):""}
function visGames(){const mk=myKids();if(fm!="meus"||!mk.length)return S.games;
  return S.games.filter(g=>{if(!g.cat)return true;const ks=mk.filter(k=>canon(k.cat)==canon(g.cat));if(!ks.length)return false;
    const done=g.gf!==undefined&&g.gf!==""&&g.gf!==null,has=(g.players||"").trim();return done||!has||ks.some(k=>conv(g,k))})}
function visGamesOld(){const mk=myKids();if(fm!="meus"||!mk.length)return S.games;return S.games.filter(g=>mk.some(k=>String(k.team).toUpperCase()==String(g.team).toUpperCase()&&(!g.cat||norm(g.cat)==norm(k.cat))))}
function filterBar(){
  if(!uid)return "";const mk=myKids();
  if(!mk.length)return `<div class="card"><div class="mu" style="margin-bottom:8px">Registe os seus filhos para ver só os jogos do escalão deles e para levar pães.</div><button class="b" data-a="tab" data-k="perfil">Ir para o Perfil</button></div>`;
  return `<div class="grid" style="margin-bottom:10px"><button class="b ${fm=="meus"?"":"o"}" data-a="fm" data-k="meus">Os meus jogos</button><button class="b ${fm=="meus"?"o":""}" data-a="fm" data-k="todos">Todos</button></div>`;
}
function perfilOld(){
  if(!uid)return '<div class="empty">Inicie sessão para gerir o seu perfil.</div>';
  const ch=myKids(),cats=[...new Set([...CATS,...S.games.map(g=>g.cat).filter(Boolean)])];
  return `<div class="card"><b>Os meus filhos</b>${ch.map((c,i)=>`<div class="row" style="margin-top:8px"><span>${esc(c.name)} <span class="tag">${esc(c.cat)}</span></span><button class="b o" data-a="delChild" data-i="${i}">Remover</button></div>`).join("")||'<div class="mu">Ainda sem filhos registados.</div>'}</div>
  <div class="card"><b>Adicionar filho/a</b><input id="c-name" placeholder="Nome (ex.: Rui Santos)"><select id="c-cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <button class="b" data-a="addChild">Adicionar</button>
  <div class="mu" style="margin-top:8px">A equipa (A ou B) é decidida pelo Mister em cada convocatória. Dois filhos no mesmo escalão aparecem como "Pais do [nome] e [nome]". Com filhos em escalões diferentes, vê os jogos de todos.</div></div>`;
}
function entsLegacy(ek){
  const out=[],used=new Set(),seen=new Set(),al=k=>[k.name,...(k.alias||[])].map(norm);
  S.fams.forEach(f=>{const ch=(f.children||[]).filter(c=>cekey(c.cat,c.team)==ek);if(!ch.length)return;
    const keys=[f.id+"|"+ek];let base=0;ch.forEach(c=>seen.add(norm(c.name)));
    S.kids.filter(k=>k.ek==ek).forEach(k=>{if(used.has(k.id))return;if(ch.some(c=>al(k).includes(norm(c.name)))){used.add(k.id);al(k).forEach(a=>seen.add(a));keys.push("k|"+k.id);base+=k.base||0}});
    out.push({label:famLabelFrom(ch),keys,base,mine:f.id==uid})});
  const roster=[...new Set(S.games.filter(g=>cekey(g.cat,g.team)==ek).flatMap(g=>(g.players||"").split(/[\n,]+/).map(s=>s.trim()).filter(Boolean)))];
  roster.forEach(name=>{const n=norm(name);if(seen.has(n))return;
    const k=S.kids.find(k=>k.ek==ek&&!used.has(k.id)&&al(k).includes(n));
    if(k){used.add(k.id);al(k).forEach(a=>seen.add(a));out.push({label:"Pais do "+k.name,keys:["k|"+k.id],base:k.base||0})}
    else{seen.add(n);out.push({label:"Pais do "+name,keys:["n|"+n],base:0})}});
  S.kids.filter(k=>k.ek==ek&&!used.has(k.id)).forEach(k=>{if(k.base||S.bread.some(b=>b.kid==k.id))out.push({label:"Pais do "+k.name,keys:["k|"+k.id],base:k.base||0})});
  return out.map(e=>({...e,n:e.base+S.bread.filter(b=>e.keys.includes(b.ek?b.uid+"|"+b.ek:"k|"+b.kid)).length}));
}
function entsOld(ek){
  const out=[],used=new Set();
  S.fams.forEach(f=>{const ch=(f.children||[]).filter(c=>cekey(c.cat,c.team)==ek);if(!ch.length)return;
    const keys=[f.id+"|"+ek];let base=0;
    S.kids.filter(k=>k.ek==ek).forEach(k=>{if(used.has(k.id))return;const nn=[k.name,...(k.alias||[])].map(norm);if(ch.some(c=>nn.includes(norm(c.name)))){used.add(k.id);keys.push("k|"+k.id);base+=k.base||0}});
    out.push({label:famLabelFrom(ch),keys,base,mine:f.id==uid})});
  S.kids.filter(k=>k.ek==ek&&!used.has(k.id)).forEach(k=>{if(k.base||S.bread.some(b=>b.kid==k.id))out.push({label:"Pais do "+k.name,keys:["k|"+k.id],base:k.base||0})});
  return out.map(e=>({...e,n:e.base+S.bread.filter(b=>e.keys.includes(b.ek?b.uid+"|"+b.ek:"k|"+b.kid)).length}));
}
function eks(){const m={};
  S.children.forEach(c=>m[canon(c.cat)]=1);
  S.games.forEach(g=>{if(g.cat)m[canon(g.cat)]=1});
  S.kids.forEach(k=>{if(k.ek)m[k.ek]=1});
  const mine=myKids().map(c=>canon(c.cat));
  return Object.keys(m).filter(k=>isAdmin||!mine.length||mine.includes(k)).map(k=>[k,catLabel(k)])}
function eksOld(){
  const m={};S.fams.forEach(f=>(f.children||[]).forEach(c=>m[cekey(c.cat,c.team)]=c.cat+" "+String(c.team).toUpperCase()));
  S.games.forEach(g=>{if(g.cat){const q=cekey(g.cat,g.team);m[q]=m[q]||g.cat+" "+String(g.team).toUpperCase()}});
  S.kids.forEach(k=>{if(k.ek)m[k.ek]=m[k.ek]||k.cat+" "+k.team});
  const mine=myKids().map(c=>cekey(c.cat,c.team));
  return Object.entries(m).filter(([k])=>isAdmin||!mine.length||mine.includes(k));
}
function paes(){
  const o=eks();if(!o.length)return '<div class="empty">Ainda sem famílias registadas. Cada pai/mãe adiciona os filhos no Perfil.</div>';
  if(!o.some(([k])=>k==pk))pk=o[0][0];
  const rows=ents(pk).sort((a,b)=>a.n-b.n||a.label.localeCompare(b.label)),max=Math.max(1,...rows.map(r=>r.n));
  return (o.length>1?`<div class="chips">${o.map(([k,l])=>`<button class="b ${k==pk?"":"o"}" data-a="pk" data-k="${k}">${esc(l)}</button>`).join("")}</div>`:`<h2>${esc(o[0][1])}</h2>`)+
  `<div class="mu" style="margin-bottom:8px">Pães levados por família. Quem levou menos vezes aparece primeiro.</div>`+
  (rows.map(r=>`<div class="card" style="padding:10px 14px"><div class="row"><b>${esc(r.label)}${r.mine?" · ⭐":""}</b><span class="tag">${r.n}</span></div><div class="bar"><i style="width:${Math.round(r.n/max*100)}%"></i></div></div>`).join("")||'<div class="empty">Ainda sem famílias neste escalão.</div>');
}

/* ---------- PÃES ---------- */
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,x)=>{try{localStorage.setItem(k,x)}catch(e){}};
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const knownKid=n=>S.kids.some(k=>[k.name,...(k.alias||[])].some(a=>norm(a)==norm(n)));
function kidLabelOld(b){const k=S.kids.find(x=>x.id==b.kid);return k?"Pais do "+k.name:(b.kid?"Pais do "+b.kid:nm(b.uid))}
function kidOpts(g){
  const pl=(g.players||"").split(/[\n,]+/).map(s=>norm(s.trim())).filter(Boolean);
  let ks=S.kids.filter(k=>[k.name,...(k.alias||[])].some(a=>pl.includes(norm(a))));if(!ks.length)ks=S.kids;
  const mine=lsGet("kid");
  return [...ks].sort((a,b)=>a.name.localeCompare(b.name)).map(k=>`<option value="${k.id}" ${k.id==mine?"selected":""}>Pais do ${esc(k.name)}</option>`).join("")||'<option value="">(sem meninos)</option>';
}
function paesOld(){
  const c={};S.bread.forEach(b=>{if(b.kid)c[b.kid]=(c[b.kid]||0)+1});
  const rows=S.kids.map(k=>({k,n:(c[k.id]||0)+(k.base||0)})).sort((a,b)=>a.n-b.n||a.k.name.localeCompare(b.k.name));
  const max=Math.max(1,...rows.map(r=>r.n));
  return `<h2>Pães levados por família</h2><div class="mu" style="margin-bottom:8px">Quem levou menos vezes aparece primeiro.</div>`+
  (rows.map(r=>`<div class="card" style="padding:10px 14px"><div class="row"><b>Pais do ${esc(r.k.name)}</b><span class="tag">${r.n}</span></div><div class="bar"><i style="width:${Math.round(r.n/max*100)}%"></i></div></div>`).join("")||'<div class="empty">Ainda sem meninos registados. O admin pode adicioná-los no separador Admin.</div>');
}

/* ---------- JOGOS ---------- */
/* ---------- RESPONSÁVEIS E FILHOS ---------- */
let childrenReady=false,migBusy=false;
const newCode=()=>Array.from({length:6},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
const hhSet=()=>new Set([uid,...S.children.filter(c=>(c.guardians||[]).includes(uid)).flatMap(c=>c.guardians||[])]);
function eligible(g){const has=(g.players||"").trim();return myKids().filter(c=>canon(c.cat)==canon(g.cat||c.cat)&&(!has||conv(g,c)))}
function breadBtn(g){const el=eligible(g);
  if(el.length<2)return `<button class="b" data-a="bread" data-id="${g.id}">Eu levo</button>`;
  return `<span style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span id="bk-${g.id}" class="chips" style="margin:0">${el.map(c=>`<label class="chip" style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto;margin:0" checked data-bk="${c.id}"> ${esc(c.name)}</label>`).join("")}</span><button class="b" data-a="bread" data-id="${g.id}">Eu levo (pelos selecionados)</button></span>`}
async function joinLocal(code){const c=S.children.find(x=>String(x.code).toUpperCase()==code);if(!c)return null;
  if(!(c.guardians||[]).includes(uid))await db.collection("children").doc(c.id).update({guardians:[...(c.guardians||[]),uid]});return c.name}
async function migrateLegacy(){
  if(migBusy||!childrenReady||!uid||!db)return;const f=S.fams.find(x=>x.id==uid);if(!f||!(f.children||[]).length)return;migBusy=true;
  try{for(const c of f.children){const dup=S.children.find(x=>norm(x.name)==norm(c.name)&&canon(x.cat)==canon(c.cat));

function ents(ek){
  const out=[],used=new Set(),seen=new Set(),al=k=>[k.name,...(k.alias||[])].map(norm);
  const ch=S.children.filter(c=>canon(c.cat)==ek),gk=c=>[...(c.guardians||[])].sort().join("+")||c.id,groups={};
  ch.forEach(c=>(groups[gk(c)]=groups[gk(c)]||[]).push(c));
  Object.values(groups).forEach(g=>{
    const ids=g.map(c=>c.id),gu=new Set(g.flatMap(c=>c.guardians||[]));let base=0;
    g.forEach(c=>seen.add(norm(c.name)));
    S.kids.filter(k=>k.ek==ek).forEach(k=>{if(used.has(k.id))return;if(g.some(c=>al(k).includes(norm(c.name)))){used.add(k.id);al(k).forEach(a=>seen.add(a));base+=k.base||0}});
    const n=base+S.bread.filter(b=>(b.kids||[]).some(x=>ids.includes(x))||(b.ek&&ekn(b.ek)==ek&&gu.has(b.uid))).length;
    out.push({label:"Pais do "+joinN(g.map(c=>c.name)),n,mine:gu.has(uid)})});
  const roster=[...new Set(S.games.filter(g=>cekey(g.cat,g.team)==ek).flatMap(g=>(g.players||"").split(/[\n,]+/).map(s=>s.trim()).filter(Boolean)))];
  roster.forEach(name=>{const n=norm(name);if(seen.has(n))return;
    const k=S.kids.find(k=>k.ek==ek&&!used.has(k.id)&&al(k).includes(n));
    if(k){used.add(k.id);al(k).forEach(a=>seen.add(a));out.push({label:"Pais do "+k.name,n:k.base||0})}else{seen.add(n);out.push({label:"Pais do "+name,n:0})}});
  S.kids.filter(k=>k.ek==ek&&!used.has(k.id)&&k.base).forEach(k=>out.push({label:"Pais do "+k.name,n:k.base}));
  return out;
}

const mapsUrl=q=>"https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(q);

async function venuePhotos(name){
  const STOP=new Set(["campo","estadio","municipal","complexo","desportivo","de","da","do","dos","das","no","pavilhao","relvado","sintetico","fut","com","the"]);
  const toks=norm(name).split(/[^a-z0-9]+/).filter(t=>t.length>2&&!STOP.has(t)&&!/^\d+$/.test(t));
  if(!toks.length)return [];
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),6000);
  try{const r=await fetch("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url&iiurlwidth=480&gsrsearch="+encodeURIComponent(name),{signal:ctl.signal});
    const j=await r.json(),pg=Object.values((j.query&&j.query.pages)||{}),need=Math.min(2,toks.length);
    return pg.filter(p=>/\.(jpe?g|png)$/i.test(p.title)&&toks.filter(t=>norm(p.title).includes(t)).length>=need&&p.imageinfo&&p.imageinfo[0]&&p.imageinfo[0].thumburl)
      .slice(0,4).map(p=>({url:p.imageinfo[0].thumburl,page:p.imageinfo[0].descriptionurl||"#"}))}
  finally{clearTimeout(tm)}
}

let D=[];
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
async function parsePdf(file){
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let t="";
  for(let p=1;p<=pdf.numPages;p++){const c=await(await pdf.getPage(p)).getTextContent();t+=c.items.map(i=>i.str).join(" ")+" "}
  t=t.replace(/\s+/g," ");
  const m=re=>{const r=t.match(re);return r?r[1].trim():""};
  const h=t.match(/^(.*?)\s+([A-Za-zÀ-ÿ\-\d]+)\s+([A-Z])\s+Convocat/i)||[];
  const club=h[1]||S.settings.name||"",cat=h[2]||"",team=h[3]||"";
  const key=norm(club.split(" ").pop()||"@@");
  const parts=m(/JOGO:\s*(.+?)\s+COMPETI/i).split(/\s+x\s+/i);
  let opp=parts[0]||"",home=true;
  if(parts.length==2){if(norm(parts[0]).includes(key)){opp=parts[1]}else{home=false;opp=parts[0]}}
  const dm=t.match(/DATA:\s*(\d\d)\/(\d\d)\/(\d{4})[^\d]*?(\d\d:\d\d)/i)||[];
  const meet=(t.match(/HORA DE ENCONTRO:\s*\d\d\/\d\d\/\d{4}\s*\S*\s*(\d\d:\d\d)/i)||[])[1]||"";
  const seg=m(/Nome\s+Assinatura\s+Observa..es\s+(.*?)\s+Informa..o adicional/i);
  const players=seg.split(/\s(?=\d{1,2}\s+\p{Lu})/u).map(p=>(p.match(/^\d{1,2}\s+(.+?)(?:\s*\|.*)?$/)||[])[1]).filter(Boolean).join("\n");
  let notes=m(/LOCAL:\s*_*\s*(.*?)\s*_{4,}\s*\(treinador\)/i);
  const tr=m(/PR.XIMO TREINO:\s*([^_]*?)\s*HORA:/i);if(tr)notes="Próximo treino: "+tr+". "+notes;
  if(!dm[1]&&!players)throw new Error("formato não reconhecido");
  return{team,cat,opp,home,comp:m(/COMPETI..O:\s*(.+?)\s+JORNADA/i),round:m(/JORNADA:\s*(.+?)\s+DATA:/i),
    date:dm[1]?`${dm[3]}-${dm[2]}-${dm[1]}`:"",time:dm[4]||"",meet,venue:m(/PONTO DE ENCONTRO:\s*(.+?)\s+HORA DE ENCONTRO/i),players,notes};
}

  screen(`<div class="card"><b>Escolha o seu clube</b><div class="mu" style="margin:6px 0">O administrador do clube terá de aprovar o seu acesso.</div>${(data||[]).map(c=>`<button class="b o" data-club="${c.id}" style="display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;text-align:left">${c.settings&&c.settings.logo?`<img src="${img(c.settings.logo)}" alt="" style="width:32px;height:32px;border-radius:6px;object-fit:cover">`:""}<span>${esc(c.name)}</span></button>`).join("")||'<div class="mu">Ainda não há clubes registados.</div>'}</div>`);
  document.querySelectorAll("[data-club]").forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc("join_club",{club:b.dataset.club});if(error)return toast(error.message);location.reload()});
}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showLogin(LINK_ERR||"");return false}
  SESS=session;CUR_ID=session.user.id;GEN++;setWho({email:session.user.email},session);let prof=null;
  for(let i=0;i<5&&!prof;i++){const r=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();prof=r.data;if(!prof)await new Promise(r=>setTimeout(r,700))}
  if(!prof){screen('<div class="empty">Não foi possível carregar o perfil. Atualize a página ou termine a sessão e entre de novo.</div>');return false}
  setWho(prof,session);if(!prof.club_id){await showClubs();return false}
  CLUB=prof.club_id;
  const {data:club}=await sb.from("clubs").select("id,name,settings").eq("id",CLUB).maybeSingle();
  S.settings=(club&&club.settings)||{};applyClub(S.settings);
  try{localStorage.setItem("club",JSON.stringify({id:CLUB,settings:S.settings}))}catch(e){}
  if(!prof.name){showName();return false}
  if(prof.role=="pending"||prof.role=="blocked"){screen(`<div class="card"><b>A aguardar aprovação</b><div class="mu" style="margin:6px 0">Olá, ${esc(prof.name)}! O administrador do clube ainda tem de aprovar o seu acesso${prof.role=="blocked"?" (pedido recusado)":""}.</div><button class="b o" id="lo">Terminar sessão</button></div>`);
    $("#lo").onclick=()=>doLogout();return false}
  ROLE=prof.role;
  user={id:async()=>session.user.id,canEdit:()=>ROLE=="admin"||ROLE=="owner",profiles:async ids=>{const {data}=await sb.rpc("get_names",{ids});const o={};(data||[]).forEach(r=>o[r.id]={name:r.name});return o}};
  db=mkDb();window.joinChildRpc=async code=>{const {data,error}=await sb.rpc("join_child",{code});if(error)throw error;return data};assets={
    async upload(file,kind){const ext=((file.name.split(".").pop()||"jpg")+"").toLowerCase().replace(/[^a-z0-9]/g,""),rnd=crypto.randomUUID();
      if(kind=="logo"){const p=`${CLUB}/logo-${rnd}.${ext}`,{error}=await sb.storage.from("club").upload(p,file,{contentType:file.type});if(error)throw error;return{id:"pub:"+p}}
      const p=`${CLUB}/${session.user.id}/${rnd}.${ext}`,{error}=await sb.storage.from("photos").upload(p,file,{contentType:file.type});if(error)throw error;return{id:p}},
    async delete(id){if(id&&!id.startsWith("pub:"))await sb.storage.from("photos").remove([id])}};
  window.HOLD=false;try{if(sessionStorage.getItem("swm")){sessionStorage.removeItem("swm");setTimeout(()=>toast("A conta mudou: dados recarregados para o novo utilizador."),600)}}catch(e){}return true;
}
async function loadPending(){const {data}=await sb.from("profiles").select("id,name,email,role,created_at").order("created_at");S.people=data||[];S.pending=S.people.filter(p=>p.role=="pending"||p.role=="blocked");render()}
function usersCard(){
  const P=S.people||[],own=ROLE=="owner";
  const row=(p,b)=>`<div class="row" style="margin-top:8px"><span>${esc(p.name||"(sem nome)")}<br><span class="mu">${esc(p.email)}</span></span><span>${b}</span></div>`;
  const pd=P.filter(p=>p.role=="pending"||p.role=="blocked"),ad=P.filter(p=>p.role=="admin"||p.role=="owner"),mb=P.filter(p=>p.role=="member");
  return `<div class="card"><b>👥 Pedidos de acesso</b>${pd.map(p=>row(p,`<button class="b" data-a="approve" data-id="${p.id}">Aprovar</button> ${p.role=="blocked"?"":`<button class="b o" data-a="reject" data-id="${p.id}">Recusar</button>`}`)).join("")||'<div class="mu">Sem pedidos pendentes.</div>'}</div>
  <div class="card"><b>🛡️ Administradores</b>${ad.map(p=>row(p,p.role=="owner"?'<span class="tag">Principal</span>':(own?`<button class="b o" data-a="rmadmin" data-id="${p.id}">Remover</button>`:'<span class="tag">Admin</span>'))).join("")}
  ${own?`<div class="mu" style="margin-top:12px">Tornar administrador (só o administrador principal pode):</div>${mb.map(p=>row(p,`<button class="b" data-a="mkadmin" data-id="${p.id}">Tornar admin</button>`)).join("")||'<div class="mu">Ainda não há pais aprovados.</div>'}`:'<div class="mu" style="margin-top:8px">Só o administrador principal pode atribuir ou retirar permissões de administração.</div>'}</div>`;
}
function mkDb(){
  const subs=[],bump=n=>subs.filter(s=>s.n==n).forEach(s=>s.run());
  const live=(table,filter,load)=>{let alive=true;const run=()=>{if(alive)load()};const ent={n:table=="clubs"?"settings":filter.replace("collection=eq.",""),run};subs.push(ent);run();
    const ch=sb.channel("rt-"+table+"-"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table,filter},run).subscribe();
    return()=>{alive=false;subs.splice(subs.indexOf(ent),1);sb.removeChannel(ch)}};
  const settingsDoc=()=>({
    async get(){const {data}=await sb.from("clubs").select("settings").eq("id",CLUB).maybeSingle();const st=data&&data.settings&&Object.keys(data.settings).length?data.settings:null;return{exists:!!st,id:"club",data:()=>st||undefined}},
    async set(d){const {error}=await sb.from("clubs").update({settings:d,...(d.name?{name:d.name}:{})}).eq("id",CLUB);if(error)throw error;try{localStorage.setItem("club",JSON.stringify({id:CLUB,settings:d}))}catch(e){}bump("settings")},
    async update(d){const c=await this.get();return this.set({...(c.exists?c.data():{}),...d})},
    async delete(){},
    onSnapshot(cb){return live("clubs","id=eq."+CLUB,async()=>cb(await this.get()))}});
  return{collection:name=>name=="settings"?{doc:()=>settingsDoc()}:({
    doc:id=>({
      async get(){const {data}=await sb.from("docs").select("data").eq("club_id",CLUB).eq("collection",name).eq("id",id).maybeSingle();return{exists:!!data,id,data:()=>data?data.data:undefined}},
      async set(d){const {error}=await sb.from("docs").upsert({club_id:CLUB,collection:name,id,data:d},{onConflict:"club_id,collection,id"});if(error)throw error;bump(name)},
      async update(d){const c=await this.get();const {error}=await sb.from("docs").upsert({club_id:CLUB,collection:name,id,data:{...(c.exists?c.data():{}),...d}},{onConflict:"club_id,collection,id"});if(error)throw error;bump(name)},
      async delete(){const {error}=await sb.from("docs").delete().eq("club_id",CLUB).eq("collection",name).eq("id",id);if(error)throw error;bump(name)},
      onSnapshot(cb,err){return live("docs","collection=eq."+name,async()=>{const {data,error}=await sb.from("docs").select("data").eq("club_id",CLUB).eq("collection",name).eq("id",id).maybeSingle();
        if(error){err&&err(error);return}cb({exists:!!data,id,data:()=>data?data.data:undefined})})}}),
    onSnapshot(cb,err){return live("docs","collection=eq."+name,async()=>{const {data,error}=await sb.from("docs").select("id,data").eq("club_id",CLUB).eq("collection",name);
      if(error){err&&err(error);return}cb({docs:data.map(r=>({id:r.id,data:()=>r.data}))})})}})};
}

/* ---------- INÍCIO ---------- */
function sub(col,key,fn){
  db.collection(col).onSnapshot(s=>{if(!CUR_ID)return;S[key]=s.docs.map(d=>({id:d.id,...d.data()}));if(key=="bread")S.bread.forEach(b=>{if(b.ek)b.ek=ekn(b.ek)});if(key=="kids")S.kids.forEach(k=>{if(k.ek)k.ek=ekn(k.ek)});if(fn)fn();render()},()=>render());
}
(async()=>{
  render();
  try{
    const okBoot=await boot();booting=false;if(!okBoot)return;
    if(user){uid=await user.id();isAdmin=user.canEdit()}
    if(!db){$("#view").innerHTML='<div class="empty">Inicie sessão para ver o espaço dos pais.</div>';return}
    db.collection("settings").doc("club").onSnapshot(s=>{if(!CUR_ID)return;S.settings=s.exists?s.data():{};render()});
    [["bdays","bdays"],["gopts","gopts"],["gvotes","gvotes"],["prefs","prefs"],["children","children"],["ideas","ideas"],["ivotes","ivotes"],["families","fams"],["kids","kids"],["games","games"],["gifts","gifts"],["contribs","contribs"],["venues","venues"],["votes","votes"],["bread","bread"],["photos","photos"]].forEach(([c,k])=>sub(c,k,k=="fams"?migrateLegacy:k=="children"?()=>{childrenReady=true;migrateLegacy()}:null));
    if(uid)db.collection("consents").doc(uid).onSnapshot(s=>{if(!CUR_ID)return;myC=s.exists?s.data():null;render()},()=>{});
    if(isAdmin){sub("consents","consents");loadPending()}
    setTimeout(()=>{if($("#view").textContent=="A carregar…")render()},10000);
  }catch(e){booting=false;render()}
})();
</script></body></html>
